spring.application.name=masspay-api

# Endereço do banco de dados Oracle da FIAP
spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL

# Usuário e senha ficam em db.properties, que não vai para o GitHub.
# Para rodar, copie db.properties.example para db.properties e preencha.
spring.config.import=optional:classpath:db.properties

# As tabelas são criadas pelo script database/01_criar_banco_masspay.sql,
# então o Hibernate não cria nem altera nada no banco.
spring.jpa.hibernate.ddl-auto=none

# Mostrar as instruções SQL executadas no banco de dados
spring.jpa.show-sql=true
